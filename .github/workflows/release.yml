name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "plans/**"
      - ".claude/**"
      - "tests/**"
      - "test-results/**"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: master

  build:
    needs: tag
    if: ${{ needs.tag.outputs.new_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package extension
        run: |
          version="${{ needs.tag.outputs.new_version }}"
          dist="dist"
          mkdir -p "$dist"

          # Only ship files the extension actually loads
          cp manifest.json background.js content.js inject.js \
             popup.html popup.css popup.js \
             icon16.png icon48.png icon128.png \
             "$dist/"

          # Sync manifest version to the release version
          jq --arg v "$version" '.version = $v' "$dist/manifest.json" > "$dist/manifest.tmp"
          mv "$dist/manifest.tmp" "$dist/manifest.json"

          cd "$dist"
          zip -r "../poe-trade-alert-${version}.zip" .

      # This repository has immutable releases enabled, which forbids
      # attaching assets once a release is published. So the release is
      # created as a draft, the zip is uploaded to the draft, and only then
      # is it published as a prerelease.
      - name: Create draft release with the package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          draft: true
          prerelease: true
          files: poe-trade-alert-${{ needs.tag.outputs.new_version }}.zip

      - name: Publish the draft as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.tag.outputs.new_tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease
